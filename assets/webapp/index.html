    .sort((a, b) => c.names[a].replace('@', '').toLowerCase().localeCompare(c.names[b].replace('@', '').toLowerCase()) || a - b);
  const color = id => PALETTE[Math.max(ids.indexOf(id), 0) % PALETTE.length];
  const plainName = id => c.names[id] || String(id);
  const name = id => plainName(id) + (id === c.king ? ' 👑' : '');
  const dot = id => el('span', { className: 'dot', style: 'background:' + color(id) });
  const tiles = c.levels[7];

  const mapPane = el('div', { className: 'pane map' });
  const rankPane = el('div', { className: 'pane' });
  const statsPane = el('div', { className: 'pane' });
  const trophiesPane = el('div', { className: 'pane' });
  const panes = { map: mapPane, rank: rankPane, stats: statsPane, trophies: trophiesPane };
  const nav = el('nav');

  const TABS = [['map', 'Mappa'], ['rank', 'Classifica'], ['stats', 'Statistiche'], ['trophies', 'Trofei']];
  const lens = el('span', { className: 'lens' });
  const tabButtons = TABS.map(([id, label]) => el('button', { onclick: () => go(id) }, icon(id), tr(label)));
  nav.append(lens, ...tabButtons);

  let shownTab = 'map';
  function go(tab) {
    shownTab = tab;
    for (const [id, pane] of Object.entries(panes)) pane.hidden = id !== tab;
    const index = TABS.findIndex(([id]) => id === tab);
    tabButtons.forEach((button, i) => { button.className = i === index ? 'on' : ''; button.ariaCurrent = i === index ? 'page' : null; });
    lens.style.transform = `translateX(${index * 100}%)`;
    if (tab === 'map' && tiles.length) { map ? map.invalidateSize() : startMap(); }
    // dragging the map down must not close the Mini App
    tab === 'map' || !story.hidden ? tg.disableVerticalSwipes?.() : tg.enableVerticalSwipes?.();
    tick();
  }

  // a light tick when the user changes tab, period, person or view (Telegram: selection changes only)
  const tick = () => tg.HapticFeedback?.selectionChanged();

  // A row of buttons with one selected: [[value, label]], the selected value, what to do on a tap
  function seg(options, selected, onPick, className = 'seg') {
    const pickIt = onPick;
    onPick = value => { tick(); pickIt(value); };
    return el('div', { className }, ...options.map(([value, label]) =>
      el('button', { className: value === selected ? 'on' : '', onclick: () => onPick(value) }, label)));
  }

  // ---------------------------------------------------------------- map (#189)

  let owner = null;  // the person the map shows; null: the whole group
  let map = null, layer = null;
  const mapDiv = el('div', { id: 'map' });
  const mapPicker = el('div', { className: 'overmap' });

  // Show one person (or null: everyone) on the map
  function pick(id) {
    owner = id;
    tick();
    mapPicker.replaceChildren(...mapControls());
    if (map) { fit(); draw(); }
  }

  // The hexagons grow with the zoom out like the maps of /conquests: zoom 10 shows the tiles, each step out the next resolution
  function draw() {
    layer.clearLayers();
    const res = Math.max(1, Math.min(7, Math.round(map.getZoom()) - 3));
    for (const tile of c.levels[res]) {
      let style;
      if (!owner) style = { color: color(tile.owner), fillColor: color(tile.owner), fillOpacity: 0.5, weight: 1 };
      else {
        const seen = tile.seen[owner];
        if (!seen) continue;
        const share = (tile.held[owner] || 0) / seen;  // how much of what the member conquered inside is still held
        style = share ? { color: color(owner), fillColor: color(owner), fillOpacity: 0.12 + 0.38 * share, weight: 1 }  // all held = 0.5, the shade of 'Tutti'
          : { color: color(owner), fillOpacity: 0.05, weight: 1, dashArray: '4' };
      }
      // an element, not a string: Leaflet writes strings as HTML and names are chosen by users
      L.polygon(tile.outline, style).bindTooltip(el('span', {}, name(tile.owner))).on('click', () => openPerson(tile.owner)).addTo(layer);
    }
  }

  function fit() {
    const corners = tiles.filter(tile => !owner || tile.seen[owner]).flatMap(tile => tile.outline);
    if (corners.length) map.fitBounds(L.latLngBounds(corners), { maxZoom: 13, padding: [20, 20] });
  }

  function startMap() {
    // one copy of the world only: the hexagons are drawn once, so a repeated world would show them on one copy
    map = L.map(mapDiv, { zoomControl: false, minZoom: 2, maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1 });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, noWrap: true, attribution: `© OpenStreetMap contributors | Caccometro v${data.version}` }).addTo(map);
    layer = L.layerGroup().addTo(map);
    map.on('zoomend', draw);
    fit();
    draw();
  }

  mapPane.append(el('h1', {}, tr('Mappa')), tiles.length ? el('div', { className: 'mapwrap' }, mapDiv, mapPicker)
    : el('p', { className: 'hint' }, tr('Nessuna zona conquistata. Dopo la 💩 manda una posizione entro 15 minuti.')));

  // ---------------------------------------------------------------- leaderboard and statistics of a period (#190)

  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif';
  const today = new Date(dayNumber(data.today) * DAY_MS);
  const current = { year: today.getUTCFullYear(), month: today.getUTCMonth() + 1 };
  let period = { ...current }, board = 'poop', charts = [];
  const cache = {};

  function step(delta) {
    tick();
    if (period.month === null) period = { year: period.year + delta, month: null };
    else {
      const months = period.year * 12 + period.month - 1 + delta;
      period = { year: Math.floor(months / 12), month: months % 12 + 1 };
    }
    drawPeriod();
  }

  function periodBar() {
    const isCurrent = period.year === current.year && (period.month === null || period.month === current.month);
    return el('div', { className: 'period' }, seg([['month', tr('Mese')], ['year', tr('Anno')]], period.month === null ? 'year' : 'month', kind => {
        period = { year: period.year, month: kind === 'year' ? null : (period.year === current.year ? current.month : 12) };
        drawPeriod();
      }),
      el('button', { className: 'arrow', onclick: () => step(-1), ariaLabel: '‹' }, '‹'),
      el('span', { className: 'label' }, period.month === null ? String(period.year) : monthText(period.year, period.month, 'short')),
      el('button', { className: 'arrow', disabled: isCurrent, onclick: () => step(1), ariaLabel: '›' }, '›'));
  }

  // ---- charts drawn like the images of the commands (charts.py): same grid, lines, dots and box plot

  function chartBox(title, height, config) {
    const canvas = el('canvas');
    charts.push(new Chart(canvas, config));
    return el('div', { className: 'card' }, ...(title ? [el('div', { className: 'charttitle' }, title)] : []),
      el('div', { className: 'chart', style: `height:${height}px` }, canvas));
  }

  // the i-th member by name: colour of the palette, a dashed line from the 9th on (charts.user_style)
  const dashOf = id => ids.indexOf(id) >= PALETTE.length ? [11, 5] : [];
  const axisTitle = text => ({ display: true, text: tr(text), color: INK.muted, font: { size: 12 } });
  const shortName = text => text.length <= 16 ? text : text.slice(0, 15) + '…';  // charts.short_name
  const percentile = (sorted, q) => {  // linear, like numpy.percentile
    const at = (sorted.length - 1) * q, low = Math.floor(at);
    return sorted[low] + (sorted[Math.min(low + 1, sorted.length - 1)] - sorted[low]) * (at - low);
  };

  function leaderboardChart(p) {
    const start = dayNumber(p.start), days = dayNumber(p.end) - start + 1;
    const shown = Math.min(dayNumber(p.today), dayNumber(p.end)) - start + 1;  // days drawn: up to today
    const year = period.month === null;
    const top = Math.max(0, ...p.leaderboard.map(r => Math.max(r.total, r.forecast ?? 0)));
    const step = year ? 100 : 10;
    const grid = layered(top * 1.05, step, step / 10);  // headroom, thin lines every 💩 (every 10 a year)
    const datasets = [];
    for (const id of ids.filter(id => p.leaderboard.some(r => r.user === id))) {
      const row = p.leaderboard.find(r => r.user === id);
      let total = 0;
      const points = [];
      for (let i = 0; i < shown; i++) points.push({ x: i + 1, y: total += p.daily[id]?.[isoOf(start + i)] || 0 });
      const last = points.length - 1;
      datasets.push({ label: plainName(id), data: points, borderColor: color(id), backgroundColor: color(id), borderWidth: 3,
        borderDash: dashOf(id), borderCapStyle: 'round', borderJoinStyle: 'round',
        pointRadius: c => c.dataIndex === last ? 5 : 0, pointBorderColor: INK.surface, pointBorderWidth: 2, pointHoverRadius: 5 });
      if (row.forecast !== null && shown < days) datasets.push({ label: plainName(id) + ' →',
        data: [{ x: shown, y: total }, { x: days, y: row.forecast }], borderColor: color(id) + 'b3', borderWidth: 3, borderDash: [0.1, 6],
        borderCapStyle: 'round', pointRadius: [0, 4.5], pointBackgroundColor: INK.surface, pointBorderColor: color(id), pointBorderWidth: 2 });
    }
    // a month: a thin line every day; a year: lines at the month starts and the names in the middle of each month
    const monthStarts = [];
    for (let i = 0; i < days; i++) if (isoOf(start + i).endsWith('-01')) monthStarts.push(i + 1);
    const x = year
      ? { afterBuildTicks: axis => { axis.ticks = monthStarts.map((m, i) => ({ value: (m + (monthStarts[i + 1] || days + 1)) / 2 })); },
          ticks: { maxRotation: 0, autoSkipPadding: 2, callback: v => new Date((start + v - 1) * DAY_MS).toLocaleString(language, { month: 'short', timeZone: 'UTC' }) } }
      : { ticks: { stepSize: 1, maxRotation: 0, autoSkipPadding: 6 }, title: axisTitle('Giorno') };
    return chartBox(tr('Come è andata giorno per giorno'), 320, { type: 'line', data: { datasets },
      options: { maintainAspectRatio: false, animation: false, interaction: { mode: 'nearest', intersect: false },
        plugins: { legend: { display: false }, layeredGrid: { grid, xs: year ? monthStarts.slice(1) : [...Array(days).keys()].map(i => i + 1) },
                   tooltip: { callbacks: { title: items => dateText(isoOf(start + items[0].parsed.x - 1)) } } },
        scales: { x: { type: 'linear', min: 1, max: days, grid: { display: false }, border: { color: INK.grid }, ...x,
                       ticks: { color: INK.muted, ...x.ticks } },
                  y: { min: 0, max: grid.max, grid: { display: false }, border: { display: false },
                       ticks: { color: INK.muted, stepSize: grid.tick, callback: v => v % grid.tick ? '' : v }, title: axisTitle('Totale progressivo') } } } });
  }

  function statisticsCharts(p) {
    const start = dayNumber(p.start);
    const shown = Math.min(dayNumber(p.today), dayNumber(p.end)) - start + 1;
    const users = ids.filter(id => p.statistics.some(s => s.user === id));
    const stat = id => p.statistics.find(s => s.user === id);
    const counts = Object.fromEntries(users.map(id => [id, [...Array(shown).keys()].map(i => p.daily[id]?.[isoOf(start + i)] || 0)]));
    const maxCount = Math.max(1, ...users.flatMap(id => counts[id]));

    // Normal curves scaled to the number of days, a dotted line and a label at each mean
    const curves = [], peaks = [];
    // the mean labels fit up to 5 people
    const faded = () => false;
    const labelled = users.length <= 5;
    for (const id of users) {
      const { mean, variance } = stat(id);
      if (variance <= 0) continue;
      const pdf = x => Math.exp(-0.5 * (x - mean) ** 2 / variance) / Math.sqrt(2 * Math.PI * variance) * shown;
      const data = [...Array(200).keys()].map(i => ({ x: i * maxCount / 199, y: pdf(i * maxCount / 199) }));
      if (faded(id)) { curves.push({ data, borderColor: INK.half, borderWidth: 1.5, pointRadius: 0 }); continue; }
      curves.push({ data, borderColor: color(id), backgroundColor: color(id) + '0d', fill: 'origin', borderWidth: labelled ? 3 : 2,
        borderDash: dashOf(id), pointRadius: 0 });
      curves.push({ data: [{ x: mean, y: 0 }, { x: mean, y: pdf(mean) }], borderColor: color(id), borderWidth: 1.5, borderDash: [1.5, 3], pointRadius: 0 });
      if (labelled) peaks.push({ mean, peak: pdf(mean), color: color(id) });
    }
    // a label that would cover another one moves up (charts.generate_statistics_chart)
    const top = Math.max(1, ...curves.flatMap(c => c.data.map(point => point.y)));
    const width = 0.13 * maxCount * 2.2, height = 0.09 * top * 1.6;  // a phone is narrower than the image: bigger boxes in data units
    const placed = [];
    for (const q of [...peaks].sort((a, b) => a.peak - b.peak)) {
      q.y = q.peak + height * 0.6;
      for (const other of [...placed].sort((a, b) => a.y - b.y)) if (Math.abs(q.mean - other.mean) < width && Math.abs(q.y - other.y) < height) q.y = other.y + height;
      placed.push(q);
    }
    const curveGrid = layered(Math.max(top, ...placed.map(q => q.y)) + height, 5);
    const curvesChart = chartBox(null, 280, { type: 'line', data: { datasets: curves },
      options: { maintainAspectRatio: false, animation: false, events: [],
        plugins: { legend: { display: false }, tooltip: { enabled: false }, meanLabels: { labels: placed },
                   layeredGrid: { grid: curveGrid, xs: [...Array(maxCount + 1).keys()] } },
        scales: { x: { type: 'linear', min: 0, max: maxCount, grid: { display: false }, border: { color: INK.grid },
                       ticks: { color: INK.muted, stepSize: 1 }, title: axisTitle('Volte al giorno') },
                  y: { min: 0, max: curveGrid.max, grid: { display: false }, border: { display: false },
                       ticks: { color: INK.muted, stepSize: curveGrid.tick, callback: v => v % curveGrid.tick ? '' : v }, title: axisTitle('Giorni') } } } });

    // Box plot: box = middle half of the days, line = median, diamond = mean, whiskers to 1.5 times the box (matplotlib)
    const boxes = users.map(id => {
      const sorted = [...counts[id]].sort((a, b) => a - b);
      const q1 = percentile(sorted, 0.25), q3 = percentile(sorted, 0.75), reach = 1.5 * (q3 - q1);
      const inside = sorted.filter(v => v >= q1 - reach && v <= q3 + reach);
      return { q1, q3, median: percentile(sorted, 0.5), mean: stat(id).mean, low: inside[0], high: inside[inside.length - 1],
               out: [...new Set(sorted.filter(v => v < q1 - reach || v > q3 + reach))], color: faded(id) ? INK.half : color(id) };
    });
    const boxChart = chartBox(tr('Distribuzione giornaliera  (◆ media, — mediana)'), 260, { type: 'bar',
      data: { labels: users.map(id => shortName(plainName(id))), datasets: [{ data: boxes.map(b => [b.q1, b.q3 === b.q1 ? b.q1 + 0.0001 : b.q3]),
        backgroundColor: users.map(id => faded(id) ? INK.fine : color(id) + '59'), borderColor: boxes.map(b => b.color), borderWidth: 2, borderSkipped: false,
        barPercentage: 0.55, categoryPercentage: 1 }] },
      options: { maintainAspectRatio: false, animation: false, events: [],
        plugins: { legend: { display: false }, tooltip: { enabled: false }, boxParts: { boxes } },
        scales: { x: { grid: { display: false }, border: { color: INK.grid }, ticks: { color: INK.text, autoSkip: false, maxRotation: 60 } },
                  y: { min: -0.3, max: maxCount + 0.6, grid: { color: INK.grid }, border: { display: false },
                       afterBuildTicks: axis => { axis.ticks = [...Array(maxCount + 1).keys()].map(value => ({ value })); },
                       ticks: { color: INK.muted },
                       title: axisTitle('Volte al giorno') } } } });
    return [curvesChart, boxChart];
  }

  // ---- the main answer first: a podium for the first three, one number for everyone else, the rest on demand

  // entries: [{ id, value, note, label }] best first, value = what the list ranks by; ties share the position
  // The streak in progress next to a name, like the streaks of chat apps: from 3 days on, grey with ⏳ while today's 💩 is missing
  function flame(id) {
    const s = records.people[id]?.status;
    if (!s || s.streak_days < 3) return [];
    const risk = !s.streak_active_today;
    return [el('span', { className: 'flame' + (risk ? ' risk' : ''), title: tr(risk ? 'serie a rischio: manca la 💩 di oggi' : 'giorni di fila') },
      `${risk ? '⏳' : '🔥'}${s.streak_days}`)];
  }

  function podium(entries) {
    const positions = entries.map(e => entries.findIndex(o => o.value === e.value));
    const tied = i => positions.filter(x => x === positions[i]).length > 1;
    const you = e => e.id === me ? [el('span', { className: 'you' }, tr('tu'))] : [];
    const step = (e, i) => el('button', { className: `step p${positions[i]}${e.id === me ? ' me' : ''}`, style: `--tint:${color(e.id)}`, onclick: () => openPerson(e.id) },
      ...(entries.some(o => o.king) ? [el('span', { className: 'crown' }, e.king ? '👑' : '\u00a0')] : []),
      el('span', { className: 'name' }, e.label || plainName(e.id)), ...you(e),
      ...(e.streak ? (flame(e.id).length ? flame(e.id) : [el('span', { className: 'flame' }, '\u00a0')]) : []),  // an empty slot keeps the steps alike
      el('span', { className: 'big' }, e.text ?? String(e.value)), ...(e.note ? [el('span', { className: 'note' }, e.note)] : []),
      el('span', { className: 'medal' }, MEDALS[positions[i]] || ''));
    const top = entries.slice(0, 3).map(step);
    const rest = entries.slice(3).map((e, k) => el('button', { className: 'rank' + (e.id === me ? ' me' : ''), style: `--tint:${color(e.id)}`, onclick: () => openPerson(e.id) },
      el('span', { className: 'pos' }, String(positions[k + 3] + 1)), el('span', { className: 'name' }, el('span', { className: 'text' }, e.label || plainName(e.id)), ...you(e),
        ...(tied(k + 3) ? [el('span', { className: 'tie' }, tr('pari'))] : [])), ...(e.streak ? flame(e.id) : []),
      el('span', { className: 'num' }, e.text ?? String(e.value))));
    // second, first, third: the leader in the middle and higher
    return [el('div', { className: 'podium' }, ...[top[1], top[0], top[2]].filter(Boolean)), ...(rest.length ? [el('div', { className: 'ranks' }, ...rest)] : [])];
  }

  // A closed section; its content (charts need a visible box) is built the first time it opens
  function more(label, build) {
    const box = el('details', { className: 'more' }, el('summary', {}, label));
    box.addEventListener('toggle', () => { if (box.open && box.children.length === 1) box.append(...build()); });
    return box;
  }

  // The table of the chart images, for the details: a denim header band, every row in its person's colour
  function scoreboard(columns, rows) {
    const head = el('tr', {}, el('th', { className: 'who' }, tr('Persona')),
      ...columns.map(([label, width]) => el('th', { style: `width:${width || 64}px` }, label)));
    const body = rows.map(row => el('tr', { style: `--tint:${color(row.id)}` },
      el('td', { className: 'who' }, el('span', {}, plainName(row.id))), ...row.cells.map(cell => el('td', {}, cell))));
    return el('table', { className: 'board' }, el('thead', {}, head), el('tbody', {}, ...body));
  }

  // Conquests of a season (who conquered most: the conqueror title) or in total (tiles held now: the map)
  let conquestView = 'season', seasonIndex = c.seasons.length - 1;
  function conquestBoard() {
    if (!c.ranking.length) return [el('p', { className: 'hint' }, tr('Nessuna zona conquistata. Dopo la 💩 manda una posizione entro 15 minuti.'))];
    const switchView = seg([['season', tr('Stagione')], ['total', tr('Totale')]], conquestView, value => { conquestView = value; drawPeriod(); });
    if (conquestView === 'total') return [el('div', { className: 'period' }, switchView),
      ...podium(c.ranking.map(r => ({ id: r.user, value: r.held, label: plainName(r.user), king: r.user === c.king, note: tr('zone tenute ora') })))];
    const season = c.seasons[seasonIndex], ongoing = seasonIndex === c.seasons.length - 1;
    const nav_ = el('div', { className: 'period' }, switchView,
      el('button', { className: 'arrow', disabled: seasonIndex === 0, ariaLabel: tr('Stagione precedente'), onclick: () => { seasonIndex--; drawPeriod(); } }, '‹'),
      el('span', { className: 'label' }, `${season.year} Q${season.quarter}`),
      el('button', { className: 'arrow', disabled: ongoing, ariaLabel: tr('Stagione successiva'), onclick: () => { seasonIndex++; drawPeriod(); } }, '›'));
    const people = Object.keys(season.conquests).map(Number).sort((x, y) => season.conquests[y] - season.conquests[x] || ids.indexOf(x) - ids.indexOf(y));
    return [nav_, ...podium(people.map(id => ({ id, value: season.conquests[id],
        label: plainName(id), king: id === season.king,
        note: `${season.held[id] || 0} ${tr(ongoing ? 'zone tenute ora' : 'zone a fine stagione')}` }))),
      el('p', { className: 'hint detail' }, tr(ongoing ? 'Conquiste di questa stagione, anche rubate: chi ne fa di più è il conquistatore. 👑 chi tiene più zone, il re.'
        : 'Conquiste della stagione, anche rubate: il primo è stato il conquistatore. 👑 chi teneva più zone a fine stagione, il re.'))];
  }

  // "Who leads, where am I, how far from the one above", in one sentence
  function answer(rows, value, unit) {
    const first = rows[0], mine = rows.findIndex(row => row.user === me);
    const bold = text => el('b', {}, text);
    const gap = (x, y) => Number.isInteger(x - y) ? x - y : number(x - y, 2);
    if (mine === 0) {
      const next = rows.find(row => value(row) < value(first));
      return el('p', { className: 'answer' }, `${tr('Sei in testa')} ${tr('con')} `, bold(unit(value(first))),
        ...(next ? [`, ${tr('{n} più di').replace('{n}', gap(value(first), value(next)))} `, bold(plainName(next.user))] : []), '.');
    }
    const lead = [`${tr('In testa')}: `, bold(plainName(first.user)), ` ${tr('con')} ${unit(value(first))}.`];
    if (mine < 0) return el('p', { className: 'answer' }, ...lead);
    const place = rows.findIndex(row => value(row) === value(rows[mine])) + 1;
    const above = [...rows.slice(0, mine)].reverse().find(row => value(row) > value(rows[mine]));
    return el('p', { className: 'answer' }, ...lead, ` ${tr('Tu sei')} `, bold(ordinal(place)),
      ...(above ? [`, ${tr('a {n} da').replace('{n}', gap(value(above), value(rows[mine])))} `, bold(plainName(above.user))] : []), '.');
  }

  function leaderboardBoard(p) {
    const mine = p.leaderboard.find(r => r.user === me);
    // where I would finish at this pace: my place among the forecasts
    const finish = mine && mine.forecast !== null ? 1 + p.leaderboard.filter(r => r.forecast > mine.forecast).length : 0;
    return [answer(p.leaderboard, r => r.total, n => `${n} 💩`),
      ...(finish ? [el('p', { className: 'hint detail' }, `${tr('A questo ritmo finisci')} ${ordinal(finish)} ${tr('con circa')} ${mine.forecast} 💩.`)] : []),
      ...podium(p.leaderboard.map(r => ({ id: r.user, value: r.total, text: `${r.total} 💩`, streak: p.start <= p.today && p.today <= p.end,
      note: r.forecast === null ? '' : `${tr(period.month === null ? 'a fine anno' : 'a fine mese')} ~${r.forecast}` }))),
      more(tr('Mostra grafico'), () => [leaderboardChart(p), ...(p.leaderboard.some(r => r.forecast !== null)
        ? [el('p', { className: 'hint detail' }, tr('Previsione: a fine periodo, al ritmo degli ultimi 30 giorni.'))] : [])])];
  }

  // How steady someone is, computed by the server (analysis.regularity); null: still too few days
  const steadiness = s => tr(s.regularity || 'ancora pochi dati');

  // My days of the period as squares, darker with more 💩, like a habit calendar: "how you go" at a glance
  function calendar(p) {
    const start = dayNumber(p.start), end = dayNumber(p.end), today = dayNumber(p.today);
    const cell = (d, label) => {
      const n = p.daily[me]?.[isoOf(d)] || 0;
      return el('span', { className: `day l${d > today ? 'x' : Math.min(n, 3)}${d === today ? ' today' : ''}`, title: `${dateText(isoOf(d))}: ${n} 💩` }, label);
    };
    const key = el('div', { className: 'calkey' }, tr('meno'), ...[0, 1, 2, 3].map(l => el('span', { className: `day l${l}` })), tr('più'));
    const utc = (y, m, d, options) => new Date(Date.UTC(y, m, d)).toLocaleString(language, { ...options, timeZone: 'UTC' });
    if (period.month !== null) {  // a month: a calendar from Monday, with the day numbers
      const weekdays = [...Array(7).keys()].map(i => el('span', { className: 'wd' }, utc(2024, 0, 1 + i, { weekday: 'narrow' })));
      const blanks = [...Array((start + 3) % 7)].map(() => el('span'));  // day 0, 1 January 1970, was a Thursday
      return [el('div', { className: 'cal month' }, ...weekdays, ...blanks, ...[...Array(end - start + 1).keys()].map(i => cell(start + i, String(i + 1)))), key];
    }
    const year = +p.start.slice(0, 4);  // a year: one row per month
    return [el('div', { className: 'cal year' }, ...[...Array(12).keys()].map(m => {
      const first = Date.UTC(year, m, 1) / DAY_MS, last = Date.UTC(year, m + 1, 1) / DAY_MS - 1;
      return el('div', { className: 'calrow' }, el('span', { className: 'mn' }, utc(year, m, 1, { month: 'narrow' })),
        ...[...Array(last - first + 1).keys()].map(i => cell(first + i, '')));
    })), key];
  }

  function statisticsBoard(p) {
    const mine = p.statistics.find(s => s.user === me);
    const place = mine ? p.statistics.findIndex(s => s.mean === mine.mean) + 1 : 0;
    const top = Math.max(...p.statistics.map(s => s.mean));
    const tile = (value, label) => el('div', { className: 'tile' }, el('div', { className: 'value' }, value), el('div', { className: 'what' }, label));
    return [
      answer(p.statistics, row => row.mean, n => `${number(n, 2)} ${tr('al giorno')}`),
      ...(mine ? [el('div', { className: 'tiles' }, tile(number(mine.mean, 2), tr('al giorno, in media')), tile(ordinal(place), tr('nel gruppo')),
        tile(number(mine.median, 0), tr('in un giorno tipico')), tile(steadiness(mine), tr('come vai'))), el('h2', {}, tr('I tuoi giorni')), ...calendar(p)] : []),
      // one sorted bar per person, the names written on the bars: me in colour, the others in grey
      el('div', { className: 'bars' }, ...p.statistics.map(s => el('button', { className: 'bar' + (s.user === me ? ' me' : ''), onclick: () => openPerson(s.user) },
        el('span', { className: 'name' }, plainName(s.user) + (s.user === me ? ` (${tr('tu')})` : '')),
        el('span', { className: 'track' }, el('span', { className: 'fill', style: `width:${s.mean / top * 100}%;--tint:${color(s.user)}` })),
        el('span', { className: 'num' }, number(s.mean, 2))))),
      more(tr('Dettagli'), () => [
        scoreboard([[tr('Media'), 60], [tr('Mediana'), 66], [tr('Varianza'), 70]],
          p.statistics.map(s => ({ id: s.user, cells: [number(s.mean, 2), number(s.median, 1), number(s.variance, 2)] }))),
        ...statisticsCharts(p)])];
  }

  async function drawPeriod() {
    const key = `${period.year}-${period.month}`;
    const switchBoard = seg([['poop', '💩'], ['conquests', tr('Conquiste')]], board, value => { board = value; drawPeriod(); }, 'tabs');
    const head = () => [el('h1', {}, tr('Classifica')), ...recapCard(), switchBoard, ...(board === 'poop' ? [periodBar()] : [])];
    if (!cache[key]) {
      const loading = () => el('p', { className: 'hint' }, '…');
      rankPane.replaceChildren(...head(), ...(board === 'poop' ? [loading()] : conquestBoard()));
      statsPane.replaceChildren(el('h1', {}, tr('Statistiche')), periodBar(), loading());
      try {
        cache[key] = await api(`/api/period?chat=${encodeURIComponent(chatId)}&year=${period.year}`
          + (period.month === null ? '' : `&month=${period.month}`));
      } catch (status) { return failed(status); }
      if (key !== `${period.year}-${period.month}`) return;  // another period was picked meanwhile
    }
    const p = cache[key];
    charts.forEach(chart => chart.destroy());
    charts = [];
    const empty = () => el('p', { className: 'hint' }, tr('Nessuna 💩 in questo periodo. Manda 💩 nel gruppo per entrare in classifica.'));
    rankPane.replaceChildren(...head(), ...(board === 'conquests' ? conquestBoard() : !p.leaderboard.length ? [empty()] : leaderboardBoard(p)), version());
    statsPane.replaceChildren(el('h1', {}, tr('Statistiche')), periodBar(), ...(!p.statistics.length ? [empty()] : statisticsBoard(p)), version());
    if (key === `${current.year}-${current.month}`) drawTrophies();
  }

  // ---------------------------------------------------------------- trophies and records (#190)

  const poops = n => `${n} 💩`;
  const METRICS = [['daily', '🥵', 'Più 💩 in un giorno', poops], ['best_month', '🤩', 'Più 💩 in un mese', poops],
    ['worst_month', '😭', 'Meno 💩 in un mese', poops], ['streak_days', '🥳', 'Serie più lunga', days],
    ['streak_count', '🫣', 'Più 💩 in una serie', poops], ['gap_days', '🤢', 'Pausa più lunga', days]];
  const NOW = [['today', '💩', 'Oggi', poops], ['active_streak', '🔥', 'Serie in corso più lunga', days],
    ['active_gap', '🐢', 'Pausa in corso più lunga', days]];
  const TROPHIES = [['years', '👑', '💩 dell\'anno'], ['months', '🏅', '💩 del mese'], ['streak_trophies', '🔥', '15 giorni di fila'],
    ['conqueror', '🚩', 'Conquistatore della stagione'], ['king', '⛰️', 'Re della stagione']];
  const trophyCount = (t, key) => typeof t[key] === 'number' ? t[key] : t[key].length;
  const trophyTotal = t => TROPHIES.reduce((sum, [key]) => sum + trophyCount(t, key), 0);
  const trophyIcons = t => TROPHIES.filter(([key]) => trophyCount(t, key)).map(([key, emoji]) => `${emoji}${trophyCount(t, key)}`).join('  ');

  // One entry of a sheet: what it is (small), the value (big), the details (small)
  function item(emoji, label, value, detail) {
    return el('div', { className: 'item' }, el('div', { className: 'what' }, `${emoji} ${label}`), el('div', { className: 'value' }, value),
      ...(detail ? [el('div', { className: 'detail' }, ...[detail].flat())] : []));
  }
  const sheet = items => items.length ? [el('div', { className: 'sheet' }, ...items)] : [];
  const whens = (list, limit = 3) => list.slice(-limit).reverse().map(whenText).join(', ') + (list.length > limit ? ', …' : '');
  const seasons = list => [...list].reverse().map(([year, quarter]) => `${year} Q${quarter}`).join(', ');

  // A record of the group in one row: what, who (the first holder, +N on a tie) and the value; a tap opens the holder
  function recordRows(metrics) {
    return metrics.filter(([key]) => records.group[key]).map(([key, emoji, label, unit]) => {
      const leaders = records.group[key], first = leaders.holders[0].key, others = leaders.holders.length - 1;
      return el('button', { className: 'record', onclick: () => openPerson(first) }, el('span', { className: 'emoji' }, emoji),
        el('span', { className: 'grow' }, el('span', { className: 'what' }, tr(label)),
          el('span', { className: 'who' }, plainName(first) + (others ? ` +${others}` : ''))),
        el('span', { className: 'num' }, unit(leaders.value)));
    });
  }

  function personTrophies(t) {
    if (!t) return [el('p', { className: 'hint' }, tr('Ancora nessun trofeo.'))];
    const detail = {
      years: () => [...t.years].reverse().join(', '), months: () => whens(t.months, 6), conqueror: () => seasons(t.conqueror),
      king: () => seasons(t.king), streak_trophies: () => t.streaks.slice(-3).reverse().map(([run, n]) => `${days(n)}: ${whenText(run)}`).join(', '),
    };
    return sheet(TROPHIES.filter(([key]) => trophyCount(t, key)).map(([key, emoji, label]) => item(emoji, tr(label), String(trophyCount(t, key)), detail[key]())));
  }

  function personRecords(id) {
    const r = records.people[id], s = r?.status;
    if (!r) return [el('p', { className: 'hint' }, tr('Nessun dato disponibile.'))];
    const tile = (label, value) => el('div', { className: 'tile' }, el('div', { className: 'value' }, value), el('div', { className: 'what' }, tr(label)));
    return [el('div', { className: 'tiles' }, tile('Oggi', poops(s.today_count)), tile('Questo mese', poops(s.month_count)),
        tile('Serie in corso', days(s.streak_days)), tile('Giorni senza 💩', days(s.gap_days))),
      el('h2', {}, tr('Record')), el('p', { className: 'note' }, tr('Pallino pieno: il record. Cerchio: adesso. Grigi: gli altri.')),
      ...sheet(METRICS.filter(([key]) => r[key]).map(([key, emoji, label, unit]) =>
        item(emoji, tr(label), unit(r[key].value), [el('span', { className: 'when' }, whens(r[key].when)), ...strip(id, key, r[key].value, unit)])))];
  }

  // A personal record against the person now and against the group record, on one scale (a bullet chart).
  // Records where less is the record (fewest in a month, longest pause) get the group's value in words only.
  // A personal record among the group's (like Strava's Local Legend): every member's record a grey dot on one line,
  // this person's in colour, where they are now as a ring, and the place in words with the gap to the next one
  function strip(id, key, mine, unit) {
    const fewest = key === 'worst_month', s = records.people[id].status;
    const all = Object.entries(records.people).map(([user, r]) => [Number(user), r[key]?.value]).filter(([, v]) => v != null);
    const better = (a, b) => fewest ? a < b : a > b;
    const ahead = all.filter(([, v]) => better(v, mine));
    const tied = all.filter(([user, v]) => v === mine && user !== id);
    const next = ahead.sort((a, b) => fewest ? b[1] - a[1] : a[1] - b[1])[0];
    const place = !ahead.length ? tr('Il record del gruppo') + (tied.length ? ` (${tr('pari con')} ${plainName(tied[0][0])})` : '')
      : `${ordinal(ahead.length + 1)} ${tr('su')} ${all.length}, ${tr('a {n} da').replace('{n}', unit(Math.abs(next[1] - mine)))} ${plainName(next[0])}`;
    const now = { daily: s.today_count, best_month: s.month_count, streak_days: s.streak_days, streak_count: s.streak_count }[key];
    const top = Math.max(...all.map(([, v]) => v), now ?? 0, 1), at = value => `left:${value / top * 100}%`;
    return [el('div', { className: 'strip' }, ...all.filter(([user]) => user !== id).map(([, v]) => el('span', { style: at(v) })),
        ...(now === undefined ? [] : [el('span', { className: 'now', style: at(now) })]), el('span', { className: 'mine', style: at(mine) })),
      el('div', { className: 'place' }, place)];
  }

  // My trophies in progress: how far the next one is (streak, 💩 of the month, conqueror of the season)
  function inProgress() {
    const items = [], s = records.people[me]?.status;
    if (s) {
      const next = (Math.floor(s.streak_days / 15) + 1) * 15;
      items.push(el('div', { className: 'item' }, el('div', { className: 'what' }, `🔥 ${tr('15 giorni di fila')}`),
        el('div', { className: 'value' }, `${s.streak_days} / ${next}`),
        el('div', { className: 'detail' }, s.streak_days ? `${tr('mancano')} ${next - s.streak_days} ${tr('giorni al prossimo trofeo')}` : tr('oggi è il giorno buono per iniziare una serie')),
        el('div', { className: 'progress' }, el('span', { style: `width:${s.streak_days % 15 / 15 * 100}%` }))));
    }
    const month = cache[`${current.year}-${current.month}`];
    if (month?.leaderboard.some(r => r.user === me)) items.push(el('div', { className: 'item' },
      el('div', { className: 'what' }, `🏅 ${tr('💩 del mese')}`), answer(month.leaderboard, r => r.total, n => `${n} 💩`)));
    const season = c.seasons[c.seasons.length - 1];
    if (season && season.conquests[me]) items.push(el('div', { className: 'item' },
      el('div', { className: 'what' }, `🚩 ${tr('Conquistatore della stagione')} ${season.year} Q${season.quarter}`),
      answer(Object.keys(season.conquests).map(Number).sort((x, y) => season.conquests[y] - season.conquests[x]).map(user => ({ user, n: season.conquests[user] })),
        row => row.n, n => `${n} ${tr('conquiste')}`)));
    return items.length ? [el('h2', {}, tr('In corso')), el('div', { className: 'sheet' }, ...items), el('h2', {}, tr('Bacheca'))] : [];
  }

  let section = 'trophies', recordsOf = null;  // recordsOf: whose records the Record section shows; null: the group
  function drawTrophies() {
    const switchSection = seg([['trophies', tr('Trofei')], ['records', tr('Record')]], section, value => { section = value; drawTrophies(); }, 'tabs');
    const winners = Object.keys(records.trophies).map(Number).sort((a, b) =>
      trophyTotal(records.trophies[b]) - trophyTotal(records.trophies[a]) || ids.indexOf(a) - ids.indexOf(b));
    const now = recordRows(NOW);
    trophiesPane.replaceChildren(el('h1', {}, tr('Trofei')), switchSection, ...(section === 'trophies'
      ? (winners.length ? [...inProgress(), ...podium(winners.map(id => ({ id, value: trophyTotal(records.trophies[id]), note: trophyIcons(records.trophies[id]) }))),
          el('ul', { className: 'legend' }, ...TROPHIES.map(([, emoji, label]) => el('li', {}, `${emoji} ${tr(label)}`)))]
        : [...inProgress(), el('p', { className: 'hint' }, tr('Ancora nessun trofeo: servono 15 giorni di fila con almeno una 💩.'))])
      : [picker(recordsOf, id => { recordsOf = id; drawTrophies(); }, id => id === null ? '' : poops(records.people[id]?.status.month_count ?? 0),
           tr('Gruppo'), tr('Di chi vuoi vedere i record?')),
         ...(recordsOf === null
           ? [...(now.length ? [el('h2', {}, tr('Adesso')), el('div', { className: 'ranks' }, ...now)] : []),
              el('h2', {}, tr('Di sempre')), el('div', { className: 'ranks' }, ...recordRows(METRICS))]
           : personRecords(recordsOf))]), version());
  }

  // ---- one person, in a sheet that slides up from the bottom; Telegram's back button closes it

  const backdrop = el('div', { className: 'backdrop', hidden: true, onclick: event => { if (event.target === backdrop) closePerson(); } });
  function closePerson() {
    backdrop.hidden = true;
    tg.BackButton?.hide();
  }
  tg.BackButton?.onClick(closePerson);
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && !backdrop.hidden) closePerson(); });

  function openPerson(id) {
    const held = c.ranking.find(x => x.user === id)?.held || 0;
    openPanel(name(id), id, [
      ...(held ? [el('button', { className: 'action', onclick: () => { closePerson(); pick(id); go('map'); } },
        `🗺️ ${held} ${tr('zone')}: ${tr('vedile sulla mappa')}`)] : []),
      ...personRecords(id), el('h2', {}, tr('Trofei')), ...personTrophies(records.trophies[id])]);
  }

  // A sheet from the bottom with a title (and the colour of a person), closed by ✕, a tap outside, Esc or Telegram's back button
  function openPanel(title, id, content) {
    const panel = el('div', { className: 'panel', role: 'dialog', ariaModal: 'true', ariaLabel: title },
      el('div', { className: 'panelhead' }, ...(id === null ? [] : [dot(id)]), el('h2', {}, title),
        el('button', { className: 'close', ariaLabel: tr('Chiudi'), onclick: closePerson }, '✕')), ...content);
    backdrop.replaceChildren(panel);
    backdrop.hidden = false;
    tg.BackButton?.show();
    panel.querySelector('.close').focus();
  }

  // Who the map shows: a button with the chosen person, the list of people slides up from the bottom
  // A button with the chosen person (null: everyone); the list of people slides up from the bottom.
  // count(id) is the number shown next to each person, allLabel the name of the "everyone" choice
  function picker(chosen, onPick, count, allLabel, question) {
    const label = id => id === null ? allLabel : id === me ? `${plainName(me)} (${tr('io')})` : plainName(id);
    const mark = id => id === null ? el('span', { className: 'all' }) : dot(id);
    const choose = () => {
      const people = [null, ...(ids.includes(me) ? [me] : []), ...ids.filter(id => id !== me)];
      openPanel(question, null, [el('div', { className: 'ranks' }, ...people.map(id =>
        el('button', { className: 'rank' + (chosen === id ? ' on' : ''), style: id === null ? '' : `--tint:${color(id)}`,
                       onclick: () => { closePerson(); onPick(id); } },
          mark(id), el('span', { className: 'name' }, label(id)), el('span', { className: 'num' }, count(id)))))]);
    };
    return el('button', { className: 'chooser', ariaLabel: question, onclick: choose },
      mark(chosen), el('span', { className: 'name' }, label(chosen)), el('span', { className: 'chev', ariaHidden: 'true' }, '▾'));
  }

  // over the map: who it shows, and a shortcut to my zones (dragging is never the only way to get there)
  const mapControls = () => [mapChooser(), ...(owner !== me && tiles.some(tile => tile.seen[me])
    ? [el('button', { className: 'chooser', onclick: () => pick(me) }, '📍 ', tr('Le mie zone'))] : [])];

  // the menu over the map
  const mapChooser = () => picker(owner, pick, id => `${id === null ? tiles.length : c.ranking.find(x => x.user === id)?.held || 0} ${tr('zone')}`,
    tr('Tutti'), tr('Chi vuoi vedere sulla mappa?'));

  // ---- the recap of the month just ended (#195): one fact per screen, a tap on the right goes on, on the left back,
  // a swipe down, ✕, Esc or Telegram's back button close it; the last screen sends the picture to share

  const recaps = data.recaps || [];  // none, one, or in early January the year and December
  let recap = recaps[0] || null;     // the one open
  const story = el('div', { className: 'story', hidden: true, role: 'dialog', ariaModal: 'true' });
  const fill = (text, values) => Object.entries(values).reduce((t, [k, v]) => t.replaceAll(`{${k}}`, v), tr(text));
  // the month in the middle of a sentence: lower case in Italian, as the bot writes it
  const monthWord = (year, month) => new Date(Date.UTC(year, month - 1, 1)).toLocaleString(language, { month: 'long', timeZone: 'UTC' });
  const longDate = iso => new Date(dayNumber(iso) * DAY_MS).toLocaleDateString(language, { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  const shortDate = iso => new Date(dayNumber(iso) * DAY_MS).toLocaleDateString(language, { day: 'numeric', month: 'long', timeZone: 'UTC' });
  // the recap of a month, or of a whole year in the first days of January
  const yearly = (r = recap) => r.month === null;
  const recapTitle = (r = recap) => yearly(r) ? fill('Il tuo {year}', { year: r.year }) : fill('Il tuo mese di {month}', { month: monthWord(r.year, r.month) });
  const recapUrl = () => '/api/recap?chat=' + encodeURIComponent(chatId) + (yearly() ? '&year=1' : '');
  let screen = 0;
  const pictures = new Map();  // recap -> the URL of its picture, drawn by the server

  async function loadPicture(r) {
    pictures.set(r, null);
    const response = await fetch(recapUrl(), { headers: { Authorization: 'tma ' + tg.initData } }).catch(() => null);
    if (!response?.ok) return pictures.delete(r);
    pictures.set(r, URL.createObjectURL(await response.blob()));
    if (!story.hidden && recap === r) drawRecap();
  }

  function recapCard() {
    return recaps.map(r => el('button', { className: 'recapcard' + (yearly(r) ? ' year' : ''), onclick: () => openRecap(0, r) },
      el('span', { className: 'big', ariaHidden: 'true' }, yearly(r) ? '🎉' : '✨'),
      el('span', {}, el('b', {}, recapTitle(r)), el('small', {}, fill('{n} 💩 · tocca per vederlo', { n: r.total }))),
      el('span', { className: 'go', ariaHidden: 'true' }, '›')));
  }

  function recapScreens() {
    const r = recap, month = yearly() ? String(r.year) : monthWord(r.year, r.month);
    const before = yearly() ? String(r.year - 1) : r.month === 1 ? monthWord(r.year - 1, 12) : monthWord(r.year, r.month - 1);
    const delta = r.total - r.previous_total;
    const signed = delta > 0 ? `+${delta}` : delta < 0 ? `−${-delta}` : '=';
    const div = (className, ...children) => el('div', { className }, ...children);
    const run = r.streak;
    const screens = [
      ['#2f4f8f', '#1d3366', [div('kicker', yearly() ? fill('Nel {year} {name} ha fatto', { year: r.year, name: plainName(me) }) : fill('A {month} {name} ha fatto', { month, name: plainName(me) })), div('huge', String(r.total)), div('mid', '💩'),
        div('line', fill('{value} al giorno, su {days} giorni.', { value: number(r.total / r.days, 1), days: r.days }))]],
      ['#e0902b', '#a0561e', [div('emo', '🏆'), div('kicker', tr('Il giorno migliore')), div('mid', longDate(r.best_day)),
        div('line', fill('con {n} 💩.', { n: r.best_count })), div('gap'), div('kicker', tr('La serie più lunga')),
        div('mid', `${days(r.streak_days)} ${tr('di fila')} 🔥`),
        div('line', run.start === run.end ? shortDate(run.start) : yearly() ? fill('dal {start} al {end}.', { start: shortDate(run.start), end: shortDate(run.end) })
          : fill('dal {start} al {end} {month}.', { start: +run.start.slice(8), end: +run.end.slice(8), month }))]],
      ...(r.people > 1 ? [['#2aa3e0', '#2f4f8f', [div('emo', MEDALS[r.place - 1] || '💪'), div('kicker', fill('Nel gruppo {name} è', { name: plainName(me) })),
        div('huge', ordinal(r.place)), div('line', r.ahead === null ? fill('su {total}: nessuno ha fatto di più!', { total: r.people })
          : fill('su {total}, a {gap} 💩 da {other}.', { total: r.people, gap: r.ahead_gap, other: plainName(r.ahead) }))]]] : []),
      ['#4caf50', '#2e7d5b', [div('emo', delta > 0 ? '📈' : delta < 0 ? '📉' : '⚖️'), div('kicker', yearly() ? fill('Rispetto al {year}', { year: before }) : fill('Rispetto a {month}', { month: before })),
        div('huge', signed),
        div('line', yearly() ? (delta === 0 ? fill('come nel {year}.', { year: before })
          : fill(delta > 0 ? '💩 in più ({n} nel {year}).' : '💩 in meno ({n} nel {year}).', { n: r.previous_total, year: before }))
          : delta === 0 ? fill('come a {month}.', { month: before })
          : fill(delta > 0 ? '💩 in più ({n} a {month}).' : '💩 in meno ({n} a {month}).', { n: r.previous_total, month: before })),
        ...(r.regularity ? [div('pill', fill('Come va: {label}', { label: tr(r.regularity) }))] : [])]],
    ];
    // the summary is the very picture the bot sends when sharing, drawn by the server
    const pictureUrl = pictures.get(recap);
    const picture = el('div', { className: 'picture' }, ...(pictureUrl ? [el('img', { src: pictureUrl, alt: recapTitle() })] : ['…']));
    if (!pictures.has(recap)) loadPicture(recap);
    const note = div('sharenote', '');
    const button = (className, name, label, action) =>
      el('button', { className, onclick: event => { event.stopPropagation(); action(note); } }, icon(name), tr(label));
    // the share sheet of the system where the web view has one (iPhone, Mac), otherwise Telegram's download (Bot API 8.0,
    // Android): the label says which; without either only the first button (#217)
    const second = canShareFiles ? [button('sharemore', 'share', 'Condividi', saveOrShare)]
      : tg.isVersionAtLeast?.('8.0') ? [button('sharemore', 'download', 'Salva sul telefono', saveOrShare)] : [];
    screens.push([null, null, [picture, button('share', 'telegram', inGroup ? 'Manda nel gruppo' : 'Manda in chat', shareHere), ...second, note]]);
    return screens;
  }

  const inGroup = Number(chatId) < 0;  // a private chat has the id of the user
  const canShareFiles = !!navigator.canShare?.({ files: [new File([''], 'caccometro.png', { type: 'image/png' })] });
  const post = action => fetch(recapUrl() + '&to=' + action, { method: 'POST', headers: { Authorization: 'tma ' + tg.initData } })
    .catch(() => null);
  const done = (note, text) => { tg.HapticFeedback?.notificationOccurred('success'); note.replaceChildren(tr(text)); };
  const failed = (note, response) =>
    note.replaceChildren(tr(response?.status === 429 ? 'Aspetta qualche secondo e riprova.' : 'Qualcosa è andato storto, riprova.'));

  // the share sheet of the system (WhatsApp, Instagram…) where the web view has one, otherwise Telegram's download
  async function saveOrShare(note) {
    const url = pictures.get(recap);
    if (url && canShareFiles)
      return navigator.share({ files: [new File([await (await fetch(url)).blob()], 'caccometro.png', { type: 'image/png' })] }).catch(() => {});
    note.replaceChildren('…');
    const response = await post('link');
    if (!response?.ok) return failed(note, response);
    note.replaceChildren();
    tg.downloadFile({ url: (await response.json()).url, file_name: 'caccometro.png' });
  }

  // the bot sends the picture in this chat: the group, or the private chat with the bot
  async function shareHere(note) {
    note.replaceChildren('…');
    const response = await post('chat');
    if (response?.ok) return done(note, inGroup ? 'Fatto! L’immagine è nel gruppo.' : 'Fatto! L’immagine è nella chat privata col bot.');
    const body = response?.status === 403 ? await response.json().catch(() => ({})) : {};
    if (body.error === 'start')
      return note.replaceChildren(tr('Prima avvia il bot in privato, poi riprova.'), el('br'),
        el('button', { onclick: event => { event.stopPropagation(); tg.openTelegramLink(`https://t.me/${body.bot}`); } }, tr('Apri il bot')));
    note.replaceChildren(tr(response?.status === 429 ? 'Aspetta qualche secondo e riprova.' : 'Qualcosa è andato storto, riprova.'));
  }

  // the bottom colour of each month (0: the year) in charts.RECAP_THEMES, shown while its background loads
  const RECAP_THEMES = ['#1f1b6e', '#1d3566', '#2b2f6e', '#26636f', '#6e4a9e', '#27705a', '#1a64ad', '#10648f', '#9a3f7e', '#6e3418', '#5e2418', '#3b2430', '#13224f'];
  function drawRecap() {
    const screens = recapScreens();
    screen = Math.max(0, Math.min(screen, screens.length - 1));
    const body = screens[screen][2];
    // the drawn background of the month (or of the year) behind every screen, the picture too, panned a little each time
    story.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, .12), rgba(0, 0, 0, .4)), url(/app/recap/${yearly() ? 'year' : String(recap.month).padStart(2, '0')}.jpg)`;
    story.style.backgroundColor = RECAP_THEMES[yearly() ? 0 : recap.month];
    story.style.backgroundPosition = `${100 * screen / Math.max(1, screens.length - 1)}% 50%`;
    story.replaceChildren(
      el('div', { className: 'progress', ariaHidden: 'true' }, ...screens.map((_, i) => el('i', { className: i <= screen ? 'done' : '' }))),
      el('div', { className: 'top' }, el('span', {}, '✨ ', tr(yearly() ? 'Il tuo anno' : 'Il tuo mese'), ' · ', yearly() ? String(recap.year) : monthText(recap.year, recap.month)),
        el('button', { ariaLabel: tr('Chiudi'), onclick: event => { event.stopPropagation(); closeRecap(); } }, '✕')),
      el('div', { className: 'body', ariaLive: 'polite' }, ...body),
      ...(screen < screens.length - 1 ? [el('div', { className: 'hintbar' }, tr('tocca per andare avanti'))] : []));
  }

  function openRecap(at, which) {
    recap = which;
    screen = at;
    story.hidden = false;
    story.ariaLabel = tr(yearly() ? 'Il tuo anno' : 'Il tuo mese');
    if (!pictures.has(recap)) loadPicture(recap);  // ready by the last screen
    tg.disableVerticalSwipes?.();  // a swipe down closes the recap, not the Mini App
    tg.BackButton?.show();
    drawRecap();
    tick();
  }

  function closeRecap() {
    if (story.hidden) return;
    story.hidden = true;
    if (backdrop.hidden) tg.BackButton?.hide();
    if (shownTab !== 'map') tg.enableVerticalSwipes?.();
  }

  story.addEventListener('click', event => {
    if (event.target.closest('button')) return;
    const forward = event.clientX > story.clientWidth / 3;
    if (!forward && screen === 0) return;
    screen += forward ? 1 : -1;
    if (screen >= recapScreens().length) return closeRecap();
    drawRecap();
    tick();
  });
  let touchY = null;
  story.addEventListener('touchstart', event => { touchY = event.touches[0].clientY; }, { passive: true });
  story.addEventListener('touchend', event => { if (touchY !== null && event.changedTouches[0].clientY - touchY > 80) closeRecap(); touchY = null; });
  tg.BackButton?.onClick(closeRecap);
  document.addEventListener('keydown', event => {
    if (story.hidden) return;
    if (event.key === 'Escape') closeRecap();
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') { screen += event.key === 'ArrowRight' ? 1 : -1; drawRecap(); }
  });

  show(el('div', { className: 'app' }, mapPane, rankPane, statsPane, trophiesPane, nav, backdrop, story));
  mapPicker.append(...mapControls());
  drawTrophies();
  // '_recap' opens the month, '_year' the year (#195)
  const opening = recaps.find(r => openOn === (yearly(r) ? 'year' : 'recap'));
  go(opening ? 'rank' : 'map');
  drawPeriod();
  if (opening) openRecap(0, opening);
}

// Opened with a direct link from a group (/app): that group, '<chat>_recap' or '<chat>_year' from the announcement of a new month (#195);
// from the private menu button: the private chat with the bot
const [startChat, startView] = (tg.initDataUnsafe.start_param || '').split('_');
openChat(startChat || tg.initDataUnsafe.user.id, startView);
</script>
