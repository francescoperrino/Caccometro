<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1154" width="900" height="1154" font-family="Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>How the Mini App works</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b2a1e"/></marker></defs><rect width="900" height="1154" rx="24" fill="#f3e4d0"/><text x="40" y="70" font-size="38" font-weight="800" fill="#3b2a1e" text-anchor="start">How the Mini App works</text><text x="40" y="100" font-size="19" font-weight="400" fill="#7a6a5c" text-anchor="start">A member opens it from Telegram. The server checks who they are</text><text x="40" y="130" font-size="19" font-weight="400" fill="#7a6a5c" text-anchor="start">and sends only the data of their chat. The phone draws everything.</text><circle cx="58" cy="188" r="16" fill="#2f4f8f"/><g transform="translate(58,188) scale(0.348)"><rect x="-14" y="-3" width="28" height="22" rx="4" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -3 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="88" y="194" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">Signed identity</text><text x="370" y="194" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">No Telegram signature, no data.</text><circle cx="58" cy="226" r="16" fill="#2f4f8f"/><g transform="translate(58,226) scale(0.348)"><circle cx="-8" cy="-8" r="7" fill="#fffaf3"/><circle cx="10" cy="-8" r="7" fill="#fffaf3"/><path d="M-22 16 a14 13 0 0 1 28 0 z M-4 16 a14 13 0 0 1 28 0 z" fill="#fffaf3"/></g><text x="88" y="232" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">Members only</text><text x="370" y="232" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">Who left the group gets nothing.</text><circle cx="58" cy="264" r="16" fill="#2f4f8f"/><g transform="translate(58,264) scale(0.348)"><path d="M0 -21 a13 13 0 0 1 13 13 c0 11 -13 26 -13 26 s-13 -15 -13 -26 a13 13 0 0 1 13 -13 z" fill="#fffaf3"/><circle cx="0" cy="-8" r="5" fill="#2f4f8f"/></g><text x="88" y="270" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">No locations</text><text x="370" y="270" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">Only hexagons leave the server.</text><rect x="40" y="310" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="369.0" r="40" fill="#5c4f42"/><g transform="translate(116,369.0) scale(0.870)"><circle cx="0" cy="-9" r="10" fill="#fffaf3"/><path d="M-19 21 a19 19 0 0 1 38 0 z" fill="#fffaf3"/></g><circle cx="150" cy="337.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="343.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">1</text><text x="190" y="354" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">You</text><text x="190" y="386" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Tap the menu button of the private chat,</text><text x="190" y="410" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">or /app in a group.</text><path d="M116 432 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="458" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="517.0" r="40" fill="#2aa3e0"/><g transform="translate(116,517.0) scale(0.870)"><path d="M-21 0 l40 -17 l-8 36 l-11 -10 l-7 8 l-1 -12 z" fill="#fffaf3"/></g><circle cx="150" cy="485.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="491.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">2</text><text x="190" y="502" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Telegram</text><text x="190" y="534" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Opens the page /app with a signed ticket:</text><text x="190" y="558" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">who you are and from which chat.</text><path d="M116 580 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="606" width="820" height="142" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="677.0" r="40" fill="#2f4f8f"/><g transform="translate(116,677.0) scale(0.870)"><path d="M0 -21 l17 6 v9 c0 13 -8 21 -17 26 c-9 -5 -17 -13 -17 -26 v-9 z" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 1 l5 5 l9 -10" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="150" cy="645.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="651.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">3</text><text x="190" y="650" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Checks</text><text x="190" y="682" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Signature younger than 24 hours (else 401),</text><text x="190" y="706" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">a chat with a database (else 404),</text><text x="190" y="730" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">still a member of the group (else 403).</text><path d="M116 752 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="778" width="820" height="142" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="849.0" r="40" fill="#2f4f8f"/><g transform="translate(116,849.0) scale(0.870)"><rect x="-18" y="-19" width="36" height="16" rx="4" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="3" width="36" height="16" rx="4" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-9" cy="-11" r="2.5" fill="#fffaf3"/><circle cx="-9" cy="11" r="2.5" fill="#fffaf3"/></g><circle cx="150" cy="817.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="823.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">4</text><text x="190" y="822" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Data</text><text x="190" y="854" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">/api/chat: map, seasons, records, trophies.</text><text x="190" y="878" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">/api/period: leaderboard and statistics</text><text x="190" y="902" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">of a month or a year, as the commands.</text><path d="M116 924 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="950" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="1009.0" r="40" fill="#2f4f8f"/><g transform="translate(116,1009.0) scale(0.870)"><rect x="-13" y="-21" width="26" height="42" rx="5" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="14" r="2.5" fill="#fffaf3"/></g><circle cx="150" cy="977.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="983.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">5</text><text x="190" y="994" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Your screen</text><text x="190" y="1026" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Map, podium, lists and charts</text><text x="190" y="1050" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">drawn on the phone.</text><g transform="translate(58,1108)"><path d="M-7 -5 a9 9 0 1 1 -2 7" fill="none" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/><path d="M-11 -9 l4 4 l5 -3" fill="none" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/></g><text x="82" y="1114" font-size="18" font-weight="800" fill="#3b2a1e" text-anchor="start">Another month or year? Only /api/period is asked again.</text><text x="860" y="1140" font-size="13" font-weight="400" fill="#7a6a5c" text-anchor="end">Caccometro v2.1.0</text></svg>
