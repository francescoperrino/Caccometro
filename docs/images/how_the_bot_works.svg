<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1098" width="900" height="1098" font-family="Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>How Caccometro works</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b2a1e"/></marker></defs><rect width="900" height="1098" rx="24" fill="#f3e4d0"/><text x="40" y="70" font-size="38" font-weight="800" fill="#3b2a1e" text-anchor="start">How Caccometro works</text><text x="40" y="100" font-size="19" font-weight="400" fill="#7a6a5c" text-anchor="start">Friends send 💩 in the group, the bot keeps the count and</text><text x="40" y="130" font-size="19" font-weight="400" fill="#7a6a5c" text-anchor="start">turns it into leaderboards, statistics, trophies and a map.</text><circle cx="58" cy="188" r="16" fill="#2f4f8f"/><g transform="translate(58,188) scale(0.348)"><rect x="-14" y="-3" width="28" height="22" rx="4" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -3 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="88" y="194" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">No message text stored</text><text x="370" y="194" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">Only who, which day and how many.</text><circle cx="58" cy="226" r="16" fill="#2f4f8f"/><g transform="translate(58,226) scale(0.348)"><circle cx="0" cy="0" r="19" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-19 0 h38 M0 -19 c-11 11 -11 27 0 38 c11 -11 11 -27 0 -38" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="88" y="232" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">Italian and English</text><text x="370" y="232" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">An admin switches with /language.</text><circle cx="58" cy="264" r="16" fill="#2f4f8f"/><g transform="translate(58,264) scale(0.348)"><rect x="-18" y="-14" width="36" height="32" rx="4" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -4 h36 M-9 -20 v8 M9 -20 v8" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="88" y="270" font-size="17" font-weight="800" fill="#3b2a1e" text-anchor="start">A new race every month</text><text x="370" y="270" font-size="16" font-weight="400" fill="#7a6a5c" text-anchor="start">And a season every three months.</text><rect x="40" y="310" width="820" height="110" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="365.0" r="40" fill="#5c4f42"/><g transform="translate(116,365.0) scale(0.870)"><circle cx="0" cy="-9" r="10" fill="#fffaf3"/><path d="M-19 21 a19 19 0 0 1 38 0 z" fill="#fffaf3"/></g><circle cx="150" cy="333.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="339.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">1</text><text x="190" y="354" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">You</text><text x="190" y="386" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Send 💩 or 🚽 (a sticker too) when it is done.</text><path d="M116 424 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="450" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="509.0" r="40" fill="#e0902b"/><g transform="translate(116,509.0) scale(0.870)"><text x="0" y="15" text-anchor="middle" font-size="40">💩</text></g><circle cx="150" cy="477.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="483.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">2</text><text x="190" y="494" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">The bot counts</text><text x="190" y="526" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">+1 on today, with a funny reply that changes</text><text x="190" y="550" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">with the hour and with the count of the day.</text><path d="M116 572 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="598" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="657.0" r="40" fill="#2f4f8f"/><g transform="translate(116,657.0) scale(0.870)"><path d="M0 -21 a13 13 0 0 1 13 13 c0 11 -13 26 -13 26 s-13 -15 -13 -26 a13 13 0 0 1 13 -13 z" fill="#fffaf3"/><circle cx="0" cy="-8" r="5" fill="#2f4f8f"/></g><circle cx="150" cy="625.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="631.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">3</text><text x="190" y="642" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Conquer</text><text x="190" y="674" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Send a location within 15 minutes:</text><text x="190" y="698" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">the hexagon on the map is yours.</text><path d="M116 720 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="746" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="805.0" r="40" fill="#2f4f8f"/><g transform="translate(116,805.0) scale(0.870)"><path d="M-18 18 h36" fill="none" stroke="#fffaf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-15" y="-2" width="8" height="16" rx="2" fill="#fffaf3"/><rect x="-4" y="-18" width="8" height="32" rx="2" fill="#fffaf3"/><rect x="7" y="-9" width="8" height="23" rx="2" fill="#fffaf3"/></g><circle cx="150" cy="773.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="779.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">4</text><text x="190" y="790" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Compare</text><text x="190" y="822" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">Leaderboards, statistics, records, trophies</text><text x="190" y="846" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">and charts; /app opens them all in one place.</text><path d="M116 868 v18" stroke="#3b2a1e" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="894" width="820" height="118" rx="20" fill="#fffaf3" stroke="#eadccb" stroke-width="1.5"/><circle cx="116" cy="953.0" r="40" fill="#2f4f8f"/><g transform="translate(116,953.0) scale(0.870)"><path d="M6 -19 a19 19 0 1 0 13 30 a15 15 0 0 1 -13 -30 z" fill="#fffaf3"/></g><circle cx="150" cy="921.0" r="16" fill="#e0902b" stroke="#fffaf3" stroke-width="3"/><text x="150" y="927.0" font-size="16" font-weight="800" fill="#fffaf3" text-anchor="middle">5</text><text x="190" y="938" font-size="23" font-weight="800" fill="#3b2a1e" text-anchor="start">Midnight</text><text x="190" y="970" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">On the 1st of the month the bot announces</text><text x="190" y="994" font-size="18" font-weight="400" fill="#7a6a5c" text-anchor="start">the 💩 of the month.</text><g transform="translate(58,1052)"><path d="M-7 -5 a9 9 0 1 1 -2 7" fill="none" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/><path d="M-11 -9 l4 4 l5 -3" fill="none" stroke="#3b2a1e" stroke-width="2.5" stroke-linecap="round"/></g><text x="82" y="1058" font-size="18" font-weight="800" fill="#3b2a1e" text-anchor="start">A new month: the race starts again.</text><text x="860" y="1084" font-size="13" font-weight="400" fill="#7a6a5c" text-anchor="end">Caccometro v2.1.0</text></svg>
